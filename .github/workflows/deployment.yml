name: Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v0.1 (a tag with this name must exist)'
        required: true
        type: string

permissions: {}
env:
  # Tag name for tag pushes, or the manually provided version for dispatch runs
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.RELEASE_VERSION }}
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - name: Fetch Arc
      run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc
      shell: bash
    - uses: dtolnay/rust-toolchain@stable
    - name: Build and bundle Rust pathfinder
      shell: bash
      run: |
        set +e
        cargo test --manifest-path native/pathfinding/Cargo.toml --no-default-features 2>&1 | tee /tmp/cargo-test.log
        test_status=${PIPESTATUS[0]}
        if [ $test_status -ne 0 ]; then
          while IFS= read -r line; do
            line=${line//%/%25}; line=${line//$'\r'/%0D}; line=${line//$'\n'/%0A}
            echo "::error::CARGOTEST $line"
          done < <(tail -80 /tmp/cargo-test.log)
          exit $test_status
        fi
        set -e
        cargo build --manifest-path native/pathfinding/Cargo.toml --release
        case "${{ matrix.platform }}" in
          windows) os=windows; file=mindustry_pathfinding.dll ;;
          linux) os=linux; file=libmindustry_pathfinding.so ;;
          macos) os=macos; file=libmindustry_pathfinding.dylib ;;
        esac
        machine=$(uname -m)
        case "$machine" in arm64|aarch64) arch=aarch64 ;; *) arch=x86_64 ;; esac
        mkdir -p "core/src/main/resources/native/$os-$arch"
        cp "native/pathfinding/target/release/$file" "core/src/main/resources/native/$os-$arch/$file"
    - uses: gradle/actions/setup-gradle@v6
    - name: Build desktop JAR
      run: ./gradlew desktop:dist -Pbuildversion=${RELEASE_VERSION#v}
      shell: bash
    - name: Package native application image
      run: jpackage --type app-image --input desktop/build/libs --main-jar Mindustry.jar --main-class mindustry.desktop.DesktopLauncher --name Mindustry --dest desktop/build/release
      shell: bash
    - name: Archive Windows application
      if: matrix.platform == 'windows'
      run: Compress-Archive -Path desktop/build/release/Mindustry -DestinationPath desktop/build/release/Mindustry-windows.zip
      shell: pwsh
    - name: Archive Linux/macOS application
      if: matrix.platform != 'windows'
      run: cd desktop/build/release && zip -rq "Mindustry-${{ matrix.platform }}.zip" Mindustry
      shell: bash
    - uses: actions/upload-artifact@v7
      with:
        name: platform-desktop-${{ matrix.platform }}
        path: desktop/build/release/Mindustry-${{ matrix.platform }}.zip
        if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.RELEASE_VERSION }}
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - uses: android-actions/setup-android@v4
    - name: Install Android SDK and NDK
      run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
    - name: Build Rust libraries for Android ABIs
      run: |
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
        cargo install cargo-ndk --locked
        cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o android/libs build --release --manifest-path native/pathfinding/Cargo.toml
    - name: Fetch Arc
      run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc
    - uses: gradle/actions/setup-gradle@v6
    - name: Build APK
      run: |
        ./gradlew android:assembleDebug -Pbuildversion=${RELEASE_VERSION#v}
        mkdir -p build/release
        cp android/build/outputs/apk/debug/*.apk build/release/Mindustry-Android.apk
    - uses: actions/upload-artifact@v7
      with:
        name: platform-android
        path: build/release/Mindustry-Android.apk
        if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.RELEASE_VERSION }}
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - name: Fetch Arc
      run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-ios
    - name: Build Rust static library for iOS
      run: |
        cargo build --manifest-path native/pathfinding/Cargo.toml --release --no-default-features --target aarch64-apple-ios
        mkdir -p ios/libs
        cp native/pathfinding/target/aarch64-apple-ios/release/libmindustry_pathfinding.a ios/libs/libmindustry_pathfinding.a
    - uses: gradle/actions/setup-gradle@v6
    - name: Build unsigned IPA
      run: |
        ./gradlew ios:createIPA -Pbuildversion=${RELEASE_VERSION#v} -PiosSkipSigning=true
        IPA=$(find ios/build -type f -name '*.ipa' -print -quit)
        test -n "$IPA"
        mkdir -p build/release
        cp "$IPA" build/release/Mindustry-iOS-unsigned.ipa
    - uses: actions/upload-artifact@v7
      with:
        name: platform-ios
        path: build/release/Mindustry-iOS-unsigned.ipa
        if-no-files-found: error

  deploy:
    needs: [desktop, android, ios]
    permissions:
      contents: write # for release creation (svenstaro/upload-release-action)

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.RELEASE_VERSION }}
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Add Arc release
      if: ${{ github.repository == 'Anuken/Mindustry' }}
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "Github Actions"
        git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc
        cd ../Arc
        git tag ${RELEASE_VERSION}
        git push https://Anuken:${{ secrets.API_TOKEN_GITHUB }}@github.com/Anuken/Arc ${RELEASE_VERSION};
        cd ../Mindustry
    - name: Fetch Arc for fork build
      if: ${{ github.repository != 'Anuken/Mindustry' }}
      run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc
    - name: Create artifacts
      run: |
        ./gradlew desktop:dist server:dist core:depsJar core:assetsJar core:mergedJavadoc -Pbuildversion=${RELEASE_VERSION:1}
    - name: Update docs
      if: ${{ github.repository == 'Anuken/Mindustry' }}
      run: |
        cd ../
        git config --global user.email "cli@github.com"
        git config --global user.name "Github Actions"
        git clone --depth=1 https://github.com/MindustryGame/docs.git
        cd docs
        find . -maxdepth 1 ! -name ".git" ! -name . -exec rm -r {} \;
        cd ../
        cp -a Mindustry/core/build/javadoc/. docs/
        cd docs
        git add .
        git commit --allow-empty -m "Update ${RELEASE_VERSION:1}"
        git push https://Anuken:${{ secrets.API_TOKEN_ORG_GITHUB }}@github.com/MindustryGame/docs
        cd ../Mindustry
    - name: Update F-Droid build string
      if: ${{ github.repository == 'Anuken/Mindustry' }}
      run: |
        git clone --depth=1 --branch=master https://github.com/Anuken/MindustryBuilds ../MindustryBuilds
        cd ../MindustryBuilds
        echo "Updating version to ${RELEASE_VERSION:1}"
        BNUM=$(($GITHUB_RUN_NUMBER + 1000))
        echo versionName=8-fdroid-${RELEASE_VERSION:1}$'\n'versionCode=${BNUM} > version_fdroid.txt
        git add .
        git commit -m "Updating to build ${RELEASE_VERSION:1}"
        git push https://Anuken:${{ secrets.API_TOKEN_GITHUB }}@github.com/Anuken/MindustryBuilds
        cd ../Mindustry
    - name: Download platform builds
      uses: actions/download-artifact@v7
      with:
        pattern: platform-*
        path: release-platform-assets
        merge-multiple: true

    - name: Upload Windows build
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: release-platform-assets/Mindustry-windows.zip
        asset_name: Mindustry-windows.zip
        tag: ${{ env.RELEASE_VERSION }}

    - name: Upload Linux build
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: release-platform-assets/Mindustry-linux.zip
        asset_name: Mindustry-linux.zip
        tag: ${{ env.RELEASE_VERSION }}

    - name: Upload macOS build
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: release-platform-assets/Mindustry-macos.zip
        asset_name: Mindustry-macos.zip
        tag: ${{ env.RELEASE_VERSION }}

    - name: Upload Android APK
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: release-platform-assets/Mindustry-Android.apk
        asset_name: Mindustry-Android.apk
        tag: ${{ env.RELEASE_VERSION }}

    - name: Upload iOS IPA (unsigned)
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: release-platform-assets/Mindustry-iOS-unsigned.ipa
        asset_name: Mindustry-iOS-unsigned.ipa
        tag: ${{ env.RELEASE_VERSION }}

    - name: Upload client artifacts
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: desktop/build/libs/Mindustry.jar
        tag: ${{ env.RELEASE_VERSION }}
    - name: Upload server artifacts
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: server/build/libs/server-release.jar
        tag: ${{ env.RELEASE_VERSION }}

    - name: Upload dependency JAR
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: core/build/libs/core-release-deps.jar
        asset_name: dependencies.jar
        tag: ${{ env.RELEASE_VERSION }}

    - name: Upload assets JAR
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: core/build/libs/core-release-assets.jar
        asset_name: assets.jar
        tag: ${{ env.RELEASE_VERSION }}
